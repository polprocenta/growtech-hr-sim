/* The game deliberately commits to one dark look on every host theme */

:root {
  color-scheme: dark;
}

html, body, #root {
  height: 100%;
  margin: 0;
}

body {
  background: #0d111b;
  color: #e2e8f0;
  overflow: hidden;
}

/* character animation */

svg g {
  transform-box: fill-box;
}

@keyframes legA {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-3px);
  }
}

@keyframes legB {
  0%, 100% {
    transform: translateY(-3px);
  }

  50% {
    transform: translateY(0);
  }
}

@keyframes bob {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-1.5px);
  }
}

@keyframes typing {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(1.2px);
  }
}

@keyframes look {
  0%, 82%, 100% {
    transform: rotate(0deg);
  }

  88% {
    transform: rotate(-6deg);
  }

  94% {
    transform: rotate(5deg);
  }
}

@keyframes breathe {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-0.6px);
  }
}

.walking .leg-a {
  animation: legA 0.36s infinite ease-in-out;
}

.walking .leg-b {
  animation: legB 0.36s infinite ease-in-out;
}

.walking .body {
  animation: bob 0.36s infinite ease-in-out;
}

.seated .arms {
  animation: typing 0.45s infinite ease-in-out;
}

.seated .head {
  animation: look 6s infinite ease-in-out;
